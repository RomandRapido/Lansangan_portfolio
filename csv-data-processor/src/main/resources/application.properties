spring.application.name=csv-data-processor

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/your_database_name
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Elasticsearch Configuration
spring.elasticsearch.uris=http://localhost:9200
# If your Elasticsearch has authentication enabled, uncomment these:
# spring.elasticsearch.username=elastic
# spring.elasticsearch.password=your_elastic_password

# Elasticsearch connection timeout settings (optional)
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=60s

# File upload settings (for CSV upload via REST API if needed)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging configuration (optional but helpful for debugging)
logging.level.org.springframework.data.elasticsearch=DEBUG
logging.level.org.springframework.data.jpa=DEBUG
logging.level.com.example.csv_data_processor=DEBUG